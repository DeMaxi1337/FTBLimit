prefix: "&8[&6FTB&eLimit&8] &r"

banned-attempt:
  - "&c━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
  - "&4&l✖ &cYou are banned from using &6FTB Ultimine&c!"
  - "&7Reason: &f{reason}"
  - "&7Banned by: &e{banned_by}"
  - "&7Date: &7{ban_date}"
  - "&c━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

limit-reached: "&6&l[!] &eYou have used up your daily limit of &c{limit}&e excavations! FTB Ultimine is now locked for &c{lockout}&e."

cooldown-chat: "&c&l[!] &cDaily excavation limit exhausted! Unlocks in: &e{remaining}&c."
cooldown-actionbar: "&c⏳ FTB Ultimine locked: &e{remaining}"

actionbar-excavated: "&a⛏ FTB Ultimine: &e{used}&7/&a{limit} &7(left: &f{remaining}&7)"
